name: Publish Dart SDK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-dart:
    name: Publish Dart SDK to pub.dev
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          
      - name: Install Dependencies
        working-directory: sdk/dart
        run: dart pub get
          
      - name: Publish Dart SDK to pub.dev
        working-directory: sdk/dart
        run: dart pub publish --force
